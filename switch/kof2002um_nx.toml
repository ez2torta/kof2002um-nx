gpu_plugin = "xenos"
gpu_submission_timestamps = false
present_painted_profile = false

# --- build 60fps (2026-11-07): cvars del bench que ganaron ---
vblank_per_swap = false
vblank_per_swap_timeout_ms = 20
texture_load_linear_direct = true
gpu_force_msaa_1x_from_2x = true
texture_load_cpu_direct = true
texture_load_cpu_poll = true
gpu_msaa_4x_alias_to_1x = true
resolve_copy_to_texture = true
resolve_skip_memory_after_copy = true
texture_poll_write_hook = true
texture_poll_hook_skip_hash = true
wait_reg_mem_spin_us = 18000
vsync_precise_spin_us = 300
texture_poll_hook_dirty_rows = true
shared_memory_cpu_upload = true
vulkan_sparse_shared_memory = false
vulkan_submit_min_interval_us = 8000
cp_pin_core = 1
cp_idle_spin_us = 300

# Licencia: bit 0 = juego comprado (XamContentGetLicenseMask). Sin esto el juego se queda en demo.
license_mask = 1

# Transferencias de render targets: el juego limpia toda la EDRAM con un clear gigante de profundidad 4x y despues
# dibuja en 1x encima; copiar esa profundidad hacia los targets de color/profundidad 1x es trabajo inutil
# (8,8 ms -> 0,15 ms por frame en portatil). Validado jugando sin problemas graficos.
rt_xfer_skip_depth_to_color = true
rt_xfer_skip_clear_like_depth = true

main_exclusive_core = 0

# --- build 2026-11-11: shaders especializados, filtro EPX a mano, copias de texturas en un worker ---
spirv_ps_implicit_lod = true
spirv_ps_static_state = true
spirv_ps_epx_hash = 716457010
texture_cpu_copy_worker_core = 2
texture_cpu_copy_claim = true

[log]
to_file = true
level = "debug"
file_writer = true
max_file_size_mb = 5
max_files = 8
